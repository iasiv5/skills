  <!-- top layer -->
  <path d="M32 26 L50 31.5 L32 37 L14 31.5 Z" fill="url(#top)"/>
  <!-- 4-point spark cutout on top layer -->
  <path d="M32 27.6 L33.5 30.5 L36.4 32 L33.5 33.5 L32 36.4 L30.5 33.5 L27.6 32 L30.5 30.5 Z" fill="#10182B"/>
