<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2440"/>
      <stop offset="1" stop-color="#10182B"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4FC3F7"/>
      <stop offset="1" stop-color="#2FE39B"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#33B5E5"/>
      <stop offset="1" stop-color="#25C08A"/>
    </linearGradient>
    <linearGradient id="bot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1E9BD0"/>
      <stop offset="1" stop-color="#1A9A72"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#2FE39B" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2FE39B" stop-opacity="0"/>
