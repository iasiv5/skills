  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect width="64" height="64" rx="14" fill="url(#glow)"/>

  <!-- bottom layer -->
  <path d="M32 41 L50 46.5 L32 52 L14 46.5 Z" fill="url(#bot)" opacity="0.5"/>
  <!-- middle layer -->
