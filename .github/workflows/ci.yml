name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dsh-plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dsh-plugin/package-lock.json
      - run: npm ci
      - name: Build (stage + manifest + gates)
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: Staged copy in sync with source
        run: npm run build -- --check
