name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dsh-plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dsh-plugin/package-lock.json
      - run: npm ci
      - name: Build (stage + manifest + gates)
        run: npm run build
      - name: Unit tests
        run: npm test
      # 注：此处不放 --check——CI 内 staging 与比对是同一份检出，恒真。
      # 真正的同步保证 = release.yml 在 tag 检出上重新构建发布，永不信任本地缓存副本。
